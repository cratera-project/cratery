name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile markdown content
        run: npm run build:content && npm run generate:answers

      - name: Run linter & quality checks
        run: npm run lint

      - name: Run security smoke checks
        run: node scripts/security_smoke.mjs

      - name: Build application & typecheck
        run: npm run build
