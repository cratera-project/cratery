name: Bug report
description: Something is broken or behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug! Please fill in the details below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Answer '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Quests / quiz content
        - Code execution (forge / notebooks)
        - Contests
        - Notes
        - Discord bot
        - Accounts / auth
        - UI / layout
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser + OS, or "self-hosted" plus your setup
      placeholder: Firefox 141 / Fedora Linux, or self-hosted on Cloudflare Workers
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output / screenshots
      description: Browser console errors or screenshots if relevant
